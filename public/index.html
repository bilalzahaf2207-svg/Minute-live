<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minute — courses de dernière minute, au meilleur prix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --text:#0d1520; --muted:#65758b;
  --border:#e3e8ee; --brand:#0f9d58; --brand-dark:#0b7c45; --brand-soft:#e6f6ee;
  --accent:#ff6a1a; --accent-soft:#fff0e6; --danger:#d93025; --deal:#0b7c45; --deal-soft:#d9f2e4;
  --shadow:0 2px 10px rgba(13,21,32,.07); --shadow-lg:0 10px 30px rgba(13,21,32,.14);
  --radius:16px; --maxw:520px; --fs:1rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f14;--surface:#141b23;--surface-2:#1c242e;--text:#eef3f8;--muted:#94a3b5;--border:#25303c;
  --brand:#2fbd77;--brand-dark:#25a166;--brand-soft:#11291f;--accent:#ff874d;--accent-soft:#2a1a10;
  --danger:#ff6b5e;--deal:#3ecd85;--deal-soft:#102a1d;--shadow:0 2px 10px rgba(0,0,0,.4);--shadow-lg:0 10px 30px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --bg:#0b0f14;--surface:#141b23;--surface-2:#1c242e;--text:#eef3f8;--muted:#94a3b5;--border:#25303c;
  --brand:#2fbd77;--brand-dark:#25a166;--brand-soft:#11291f;--accent:#ff874d;--accent-soft:#2a1a10;
  --danger:#ff6b5e;--deal:#3ecd85;--deal-soft:#102a1d;--shadow:0 2px 10px rgba(0,0,0,.4);--shadow-lg:0 10px 30px rgba(0,0,0,.5);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.45;overflow-x:hidden;
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body.comfort{--fs:1.16rem;--radius:18px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:left}
input{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;min-height:100vh;padding-bottom:110px;position:relative}
.pad{padding:0 16px}
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:10px 16px}
.loc{display:flex;align-items:center;gap:10px;width:100%}
.loc .pin{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.loc .txt{min-width:0;flex:1}
.loc .lbl{font-size:.7em;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:block}
.loc .val{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 38px;text-align:center}
.brandrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:-.02em;font-size:1.12em}
.logo .dot{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--accent));display:grid;place-items:center;color:#fff;font-size:.72em}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-top:10px}
.search input{border:none;background:none;outline:none;width:100%}
.h1{font-size:1.45em;font-weight:800;letter-spacing:-.02em;margin:18px 0 4px}
.h2{font-size:1.06em;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--muted);font-size:.87em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;font-weight:700;
  padding:15px 18px;border-radius:14px;width:100%;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.deal{background:var(--deal)}
.btn.ghost{background:transparent;color:var(--brand);font-weight:700;padding:10px;justify-content:center}
.btn.sm{padding:10px 14px;border-radius:12px;font-size:.9em;width:auto}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75em;font-weight:700;padding:3px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.green{background:var(--brand-soft);color:var(--brand-dark)}
.pill.deal{background:var(--deal-soft);color:var(--deal)}
.pill.orange{background:var(--accent-soft);color:var(--accent)}
.pill.red{background:rgba(217,48,37,.12);color:var(--danger)}
.row{display:flex;align-items:center;gap:10px}
.scroll-x{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px}
.ob .big{font-size:1.95em;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:14px 0 6px}
.profcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius);background:var(--surface);
  border:2px solid var(--border);width:100%;margin-bottom:10px;box-shadow:var(--shadow)}
.profcard.on{border-color:var(--brand);background:var(--brand-soft)}
.profcard .ic{font-size:1.6em;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center}
.profcard b{display:block}.profcard span{font-size:.84em;color:var(--muted)}
.store{display:block;width:100%;padding:14px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow)}
.store.closed{opacity:.55}
.slogo{width:50px;height:50px;flex:0 0 50px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1em}
.nm{font-weight:800;display:flex;align-items:center;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.eta{text-align:right;flex:0 0 auto}.eta b{display:block}.eta span{font-size:.72em;color:var(--muted)}
.ql{flex:0 0 190px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;min-height:120px}
.ql .em{font-size:1.45em}.ql b{font-size:.95em;line-height:1.2}.ql span{font-size:.77em;color:var(--muted)}
.ql .go{margin-top:auto;font-size:.79em;font-weight:700;color:var(--brand)}
.cattab{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:.85em;white-space:nowrap}
.cattab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.prod{padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px}
.prod .em{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:1.45em}
.prod .info{flex:1;min-width:0}
.prod .info b{display:block;font-weight:700;font-size:.95em;line-height:1.25}
.prod .info .vl{font-size:.8em;color:var(--muted);display:block}
.price{font-weight:800;white-space:nowrap}
.was{text-decoration:line-through;color:var(--muted);font-weight:600;font-size:.82em}
.addbtn{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--brand);color:#fff;font-size:1.25em;font-weight:700;display:grid;place-items:center}
.qty{display:flex;align-items:center;gap:2px;background:var(--brand);border-radius:12px;color:#fff;flex:0 0 auto}
.qty button{width:34px;height:38px;color:#fff;font-size:1.2em;font-weight:700;text-align:center}
.qty b{min-width:20px;text-align:center;font-size:.95em}
.compare{display:flex;align-items:center;gap:6px;width:100%;margin-top:10px;padding:8px 10px;border-radius:11px;
  background:var(--deal-soft);color:var(--deal);font-weight:700;font-size:.82em}
.varrow{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;border:2px solid var(--border);margin-bottom:9px;background:var(--surface)}
.varrow.best{border-color:var(--deal);background:var(--deal-soft)}
.varrow.cur{border-color:var(--brand)}
.varrow .info{flex:1;min-width:0}
.varrow b{display:block;font-size:.93em}
.varrow .u{font-size:.78em;color:var(--muted)}
.crit{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:.94em}
.line.total{font-weight:800;font-size:1.1em;border-top:1px solid var(--border);margin-top:8px;padding-top:12px}
.line.eco{color:var(--deal);font-weight:700}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border)}
.opt:last-child{border-bottom:none}.opt .info{flex:1}.opt b{display:block;font-size:.94em}.opt span{font-size:.79em;color:var(--muted)}
.sw{width:48px;height:28px;flex:0 0 48px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);position:relative;transition:.18s}
.sw i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw.on{background:var(--brand);border-color:var(--brand)}.sw.on i{transform:translateX(20px)}
.radio{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);width:100%}
.radio:last-child{border-bottom:none}
.dotr{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center}
.radio.on .dotr{border-color:var(--brand)}
.radio.on .dotr::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--brand)}
.cartbar{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow-lg)}
.cartbar-in{max-width:var(--maxw);margin:0 auto}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:var(--maxw);margin:0 auto;display:flex}
.tab{flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.67em;font-weight:700;text-align:center}
.tab .ic{font-size:1.32em;line-height:1;position:relative}
.tab.on{color:var(--brand)}
.badge{position:absolute;top:-5px;right:-11px;background:var(--accent);color:#fff;font-size:.56rem;font-weight:800;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.nudge{position:fixed;left:0;right:0;z-index:55;bottom:calc(76px + env(safe-area-inset-bottom));padding:0 16px}
.nudge-in{max-width:calc(var(--maxw) - 32px);margin:0 auto;background:var(--deal);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:10px;animation:up .25s ease}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.nudge b{display:block;font-size:.9em}.nudge span{font-size:.78em;opacity:.92}
.nudge .act{background:#fff;color:var(--deal);font-weight:800;padding:9px 12px;border-radius:11px;font-size:.84em;white-space:nowrap;text-align:center}
.track{padding:18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.step{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:20px}
.step:last-child{padding-bottom:0}
.step .bul{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--surface-2);border:2px solid var(--border);display:grid;place-items:center;font-size:.73em;z-index:2}
.step::before{content:'';position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--border)}
.step:last-child::before{display:none}
.step.done .bul{background:var(--brand);border-color:var(--brand);color:#fff}
.step.done::before{background:var(--brand)}
.step.now .bul{background:var(--accent);border-color:var(--accent);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,106,26,.5)}50%{box-shadow:0 0 0 9px rgba(255,106,26,0)}}
.step b{font-size:.95em}.step span{display:block;font-size:.81em;color:var(--muted)}
.progressbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .6s}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty .em{font-size:2.8em;display:block;margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:130px;z-index:99;background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-weight:700;font-size:.84em;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:22px 22px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.25s cubic-bezier(.3,.9,.3,1);
  max-width:var(--maxw);margin:0 auto;max-height:88vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 14px}
.field{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);outline:none;margin-top:8px}
.back{display:flex;align-items:center;gap:6px;font-weight:700;padding:12px 0}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;border-radius:var(--radius);padding:15px;margin-top:14px;width:100%}
.hero b{font-size:1em}.hero p{margin:4px 0 0;font-size:.84em;opacity:.9}
.ecohero{background:linear-gradient(135deg,var(--deal),#0a6b3c);color:#fff;border-radius:var(--radius);padding:15px;width:100%;margin-top:12px}
.ordercard{padding:14px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="sheetbg" id="sheetbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<script>
/* ==========================================================

F('huile','essentiels','🫒',"Huile d'olive vierge extra",'L',[

F('jambon','frais','🥓','Jambon blanc','kg',[

const $=s=>document.querySelector(s);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function ouvert(s){const h=new Date().getHours()+new Date().getMinutes()/60;return s.close>=24?true:(h>=s.open&&h<s.close)}
function etaMin(s){return Math.round(s.prep+s.dist*4)}
function eta(s){const t=etaMin(s);return t+'–'+(t+8)}
function prix(sid,pid){const p=PBY[pid],s=SBY[sid];
  if(p.prices&&p.prices[sid])return p.prices[sid].value;   // prix réellement relevé en magasin
  let px=s.px; if(p.tier<=2) px=1+(s.px-1)*0.55;            // les MDD suivent moins l'enseigne
  return Math.round(p.price*px*20)/20}
function dispo(sid,pid){const p=PBY[pid],s=SBY[sid];
  if(LIVE)return !!(p.prices&&p.prices[sid]);              // en direct : dispo = prix relevé ici
  if(p.tier===1&&s.noPP)return false;                        // pas de premier prix chez les enseignes premium
  if(p.tier===4&&s.noBio)return false;                       // pas de premium chez les hard-discounters
  if(hash(sid+'|'+pid)%23===0)return false;                  // rupture ponctuelle
  return true}
function dispoVars(sid,fid){return FBY[fid].vars.filter(v=>dispo(sid,v.id))}
function uPrice(sid,v){return prix(sid,v.id)/v.qty}
function fmtU(sid,v){const u=uPrice(sid,v);
  return (u<0.1? (u*100).toFixed(1).replace('.',',')+' ct':u.toFixed(2).replace('.',','))+' €/'+v.unit}
const NG=n=>n?('ABCDE'.indexOf(n)):-1;
/* Provenance du prix : relevé daté en magasin, ou estimation. */
function releve(sid,pid){const p=PBY[pid];
 if(p&&p.prices&&p.prices[sid]){const d=new Date(p.prices[sid].date);
  return ' · <span style="color:var(--deal)">relevé le '+d.toLocaleDateString('fr-FR')+'</span>'}
 return LIVE?' · <span style="color:var(--muted)">prix estimé</span>':' · ⭐ '+(p?p.rate.toFixed(1).replace('.',','):'')}

/* --- cœur du comparateur : le moins cher à qualité équivalente --- */
function qualiteOK(cand,ref){
  const seuil=(cand.cat==='bebe')?4.2:4.0;                         // on est plus exigeant sur le rayon bébé
  if(cand.rate<seuil)return false;                                 // jamais un produit mal noté
  if(ref.nutri&&cand.nutri&&NG(cand.nutri)>NG(ref.nutri))return false; // jamais un Nutri-Score dégradé
  return true}
function meilleur(sid,fid,ref){
  const l=dispoVars(sid,fid).filter(v=>qualiteOK(v,ref||FBY[fid].vars[0]));
  if(!l.length)return null;
  return l.sort((a,b)=>uPrice(sid,a)-uPrice(sid,b))[0]}
function reference(sid,fid){ // la version « réflexe » : grande marque, sinon la plus chère dispo
  const l=dispoVars(sid,fid); if(!l.length)return null;
  return l.find(v=>v.tier===3)||l.sort((a,b)=>uPrice(sid,b)-uPrice(sid,a))[0]}
function recommande(sid,fid){ // ce qu'on affiche par défaut en rayon
  const ref=reference(sid,fid); if(!ref)return null;
  return state.economie?(meilleur(sid,fid,ref)||ref):ref}
function economiePct(sid,a,b){return Math.round((1-uPrice(sid,a)/uPrice(sid,b))*100)}
function critères(sid,cand,ref){
  const c=[];
  c.push(cand.qty>=ref.qty?'Contenance ≥':'Même usage');
  if(cand.nutri&&ref.nutri)c.push(NG(cand.nutri)<NG(ref.nutri)?('Nutri-Score '+cand.nutri+' — meilleur'):('Nutri-Score '+cand.nutri+' identique'));
  c.push('Noté '+cand.rate.toFixed(1).replace('.',',')+'/5');
  if(cand.fam==='laitinf')c.push('Composition encadrée par la réglementation');
  return c}
/* --- équivalent moins cher d'un produit précis (pour un article du panier) --- */
function altMoinsCher(sid,pid){
  const cur=PBY[pid], b=meilleur(sid,cur.fam,cur);
  if(!b||b.id===pid)return null;
  const g=uPrice(sid,cur)-uPrice(sid,b);
  if(g<=0)return null;
  if(economiePct(sid,b,cur)<8)return null;                      // on ne dérange pas pour 3 %
  return {alt:b,pctUnit:economiePct(sid,b,cur)}}

function heurePlus(m){const d=new Date(Date.now()+m*60000);return d.getHours()+' h '+String(d.getMinutes()).padStart(2,'0')}

function add(pid,silent){
  const sid=state.storeId||state.cart.storeId;
  if(state.cart.storeId&&state.cart.storeId!==sid&&nbArticles()>0){
    if(!confirm('Votre panier vient de '+SBY[state.cart.storeId].name+'. Le vider ?'))return;
    state.cart.items={};state.ecoPanier=0}
  state.cart.storeId=sid;
  state.cart.items[pid]=(state.cart.items[pid]||0)+1;
  if(!silent){const a=altMoinsCher(sid,pid);
    state.nudge=a?{pid,alt:a.alt.id,pct:a.pctUnit}:null;
    if(state.nudge)setTimeout(()=>{if(state.nudge&&state.nudge.pid===pid){state.nudge=null;render()}},9000)}
  save();render()}
function sub(pid){if(!state.cart.items[pid])return;state.cart.items[pid]--;
  if(state.cart.items[pid]<=0)delete state.cart.items[pid];
  if(nbArticles()===0){state.cart.storeId=null;state.ecoPanier=0}
  save();render()}
function viderPanier(){state.cart={storeId:null,items:{}};state.pourboire=0;state.ecoPanier=0;save();render()}

/* remplacement d'un article par son équivalent moins cher */
function remplacer(pid,altId,q){
  const sid=state.cart.storeId||state.storeId;
  const n=q||state.cart.items[pid]||1;
  const gain=(prix(sid,pid)-prix(sid,altId))*n;
  delete state.cart.items[pid];
  state.cart.items[altId]=(state.cart.items[altId]||0)+n;
  if(gain>0){state.ecoPanier+=gain;state.eco+=gain}
  state.nudge=null;save();render();closeSheet();
  toast(gain>0?('Remplacé — '+eur(gain)+' économisés'):'Produit remplacé')}

function optimisations(){
  const sid=state.cart.storeId;if(!sid)return[];
  const out=[];
  Object.entries(state.cart.items).forEach(([pid,q])=>{
    const a=altMoinsCher(sid,pid);
    if(a){const gain=(prix(sid,pid)-prix(sid,a.alt.id))*q;
      if(gain>0.05)out.push({pid,alt:a.alt,q,gain,pct:a.pctUnit})}});
  return out.sort((x,y)=>y.gain-x.gain)}
function optimiserTout(){
  const l=optimisations();if(!l.length){toast('Votre panier est déjà au meilleur prix');return}
  let g=0;l.forEach(o=>{const n=state.cart.items[o.pid]||o.q;delete state.cart.items[o.pid];
    state.cart.items[o.alt.id]=(state.cart.items[o.alt.id]||0)+n;g+=o.gain});
  state.ecoPanier+=g;state.eco+=g;save();render();
  toast('Panier optimisé — '+eur(g)+' économisés')}

/* comparaison du même panier dans les autres enseignes */
function paniertAilleurs(){
  if(!state.cart.storeId)return[];
  const fams=Object.entries(state.cart.items).map(([pid,q])=>({fam:PBY[pid].fam,tier:PBY[pid].tier,q}));
  return STORES.filter(ouvert).map(s=>{
    let tot=0,manque=0;
    fams.forEach(f=>{const ref=reference(s.id,f.fam);
      const v=state.economie?(meilleur(s.id,f.fam,ref)||ref):(dispoVars(s.id,f.fam).find(x=>x.tier===f.tier)||ref);
      if(!v){manque++;return}tot+=prix(s.id,v.id)*f.q});
    return{s,tot,all:tot+s.fee+FRAIS_SERVICE,manque}
  }).sort((a,b)=>a.all-b.all)}
function basculerMagasin(sid){
  const fams=Object.entries(state.cart.items).map(([pid,q])=>({fam:PBY[pid].fam,q}));
  const items={};let ok=0;
  fams.forEach(f=>{const ref=reference(sid,f.fam);const v=state.economie?(meilleur(sid,f.fam,ref)||ref):ref;
    if(v){items[v.id]=(items[v.id]||0)+f.q;ok++}});
  state.cart={storeId:sid,items};state.storeId=sid;save();render();closeSheet();
  toast('Panier transféré chez '+SBY[sid].name)}

function lancerListe(qid){
  const ql=QUICKLISTS.find(q=>q.id===qid);
  let best=null,bs=-1e9;
  STORES.filter(ouvert).forEach(s=>{
    let tot=0,n=0;
    ql.items.forEach(f=>{const ref=reference(s.id,f);const v=meilleur(s.id,f,ref)||ref;if(v){tot+=prix(s.id,v.id);n++}});
    const sc=n*8-tot-s.fee-etaMin(s)/6;
    if(sc>bs){bs=sc;best=s}});
  if(!best)best=STORES[0];
  const items={};
  ql.items.forEach(f=>{const ref=reference(best.id,f);const v=(state.economie?meilleur(best.id,f,ref):ref)||ref;if(v)items[v.id]=1});
  state.cart={storeId:best.id,items};state.storeId=best.id;state.ecoPanier=0;state.view='cart';
  save();render();toast(Object.keys(items).length+' articles ajoutés chez '+best.name)}

  `<button class="btn sec" style="margin-bottom:14px" onclick="sheetComparerMagasins()">🏪 Comparer ce panier dans les autres enseignes</button>`}

 ${t.st<s.min?`<div class="card" style="padding:12px;margin-bottom:14px;border-color:var(--accent)">
   <b style="font-size:.9em">Ajoutez ${eur(s.min-t.st)} pour éviter les frais de petite commande (${eur(FRAIS_PETITE)})</b></div>`:''}

 <div class="card" style="padding:14px;margin-bottom:14px">
  <div class="line"><span>Sous-total</span><span>${eur(t.st)}</span></div>
  <div class="line"><span>Livraison</span><span>${eur(t.liv)}</span></div>
  ${t.petite?`<div class="line"><span>Frais petite commande</span><span>${eur(t.petite)}</span></div>`:''}
  <div class="line"><span>Frais de service</span><span>${eur(t.serv)}</span></div>
  ${t.montee?`<div class="line"><span>Montée à l'étage</span><span>${eur(t.montee)}</span></div>`:''}
  ${state.ecoPanier>0?`<div class="line eco"><span>Économies réalisées</span><span>− ${eur(state.ecoPanier)}</span></div>`:''}
  <div class="line total"><span>Total</span><span>${eur(t.total)}</span></div></div>
 <button class="btn" onclick="go('checkout')">Passer au paiement · ${eur(t.total)}</button></div>`}

function sheetComparerMagasins(){
 const ail=paniertAilleurs(), cur=state.cart.storeId;
 openSheet(`<h3 style="margin:0 0 4px;font-size:1.1em">Le même panier, ailleurs</h3>
 <p class="sub" style="margin:0 0 14px">Total livraison et frais de service compris, avec l'équivalent le moins cher disponible dans chaque enseigne.</p>
 ${ail.map((a,i)=>`<div class="varrow ${i===0?'best':a.s.id===cur?'cur':''}">
   <span class="slogo" style="width:40px;height:40px;flex:0 0 40px;border-radius:11px;font-size:.8em;background:${a.s.color}">${esc(a.s.name.split(' ')[0].slice(0,2).toUpperCase())}</span>
   <span class="info"><b>${esc(a.s.name)}${a.s.id===cur?' · actuel':''}</b>
   <span class="u">${a.s.dist.toFixed(1)} km · ${eta(a.s)} min · livraison ${eur(a.s.fee)}${a.manque?' · '+a.manque+' manquant(s)':''}</span></span>
   <span style="text-align:right"><span class="price" style="display:block">${eur(a.all)}</span>
   ${a.s.id!==cur?`<button class="btn sm ${i===0?'deal':'sec'}" style="margin-top:6px" onclick="basculerMagasin('${a.s.id}')">Choisir</button>`:'<span class="pill green">Ici</span>'}</span></div>`).join('')}
 <p class="sub" style="font-size:.77em;margin-top:6px">Un panier moins cher dans une enseigne plus lointaine peut aussi être plus long à livrer.</p>`)}

function vCheckout(){
 const s=SBY[state.cart.storeId], t=totaux();
 return`<div class="pad"><button class="back" onclick="go('cart')">← Panier</button>
 <div class="h1">Finaliser la commande</div>
 <div class="h2">Adresse de livraison</div>
 <button class="card" style="width:100%;padding:14px" onclick="sheetAdresse()"><div class="row">
  <span style="width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center">📍</span>
  <span style="flex:1"><b style="display:block;font-size:.94em">${state.adresse?esc(state.adresse):'Adresse à renseigner'}</b>
  <span class="sub">${state.geo?('Position GPS ± '+state.geo.acc+' m'):'Appuyez pour modifier'}</span></span><span>✎</span></div></button>
 <div class="h2">Quand ?</div>
 <div class="card">${CRENEAUX.map(c=>`<button class="radio ${state.creneau===c.id?'on':''}" onclick="state.creneau='${c.id}';render()">
  <span class="dotr"></span><span class="info"><b>${c.name}${c.id==='asap'?' — vers '+heurePlus(etaMin(s)+8):''}</b>
  <span>${c.desc||('Livré par '+esc(s.name))}</span></span></button>`).join('')}</div>
 <div class="h2">Options de livraison</div>
 <div class="card">
  ${optRow('montee','Monter les courses chez moi','Dépôt à votre porte (+'+eur(FRAIS_MONTEE)+')')}
  ${optRow('porte','Laisser devant la porte','Sans contact, photo à l’appui')}
  ${optRow('appel',"M'appeler à l'arrivée",'Utile en immeuble ou avec un bébé qui dort')}
  ${optRow('substitution','Autoriser les remplacements','Un produit manquant sera remplacé par un équivalent de même prix ou moins cher')}</div>
 <div class="h2">Pourboire livreur</div>
 <div class="scroll-x">${[0,1,2,3,5].map(v=>`<button class="cattab ${state.pourboire===v?'on':''}" onclick="state.pourboire=${v};render()">${v===0?'Aucun':eur(v)}</button>`).join('')}</div>
 <div class="h2">Paiement</div>
 <div class="card">${PAIEMENTS.map(p=>`<button class="radio ${state.paiement===p.id?'on':''}" onclick="state.paiement='${p.id}';render()">
  <span class="dotr"></span><span style="font-size:1.15em">${p.em}</span>
  <span class="info"><b>${p.name}</b><span>${p.desc}</span></span></button>`).join('')}</div>
 <div class="card" style="padding:14px;margin-top:16px">
  <div class="line"><span>Sous-total</span><span>${eur(t.st)}</span></div>
  <div class="line"><span>Livraison + service</span><span>${eur(t.liv+t.serv+t.petite)}</span></div>
  ${t.montee?`<div class="line"><span>Montée à l'étage</span><span>${eur(t.montee)}</span></div>`:''}
  ${t.pourboire?`<div class="line"><span>Pourboire</span><span>${eur(t.pourboire)}</span></div>`:''}
  ${state.ecoPanier>0?`<div class="line eco"><span>Grâce aux équivalents choisis</span><span>− ${eur(state.ecoPanier)}</span></div>`:''}
  <div class="line total"><span>Total à payer</span><span>${eur(t.total)}</span></div></div>
 <button class="btn" style="margin-top:16px" onclick="commander()">Commander · ${eur(t.total)}</button>
 <p class="sub" style="text-align:center;margin:10px 0 0;font-size:.77em">Démonstration — aucun prélèvement réel.</p></div>`}
function optRow(k,t,d){return`<div class="opt" onclick="state.opts['${k}']=!state.opts['${k}'];save();render()">
 <span class="info"><b>${t}</b><span>${d}</span></span><span class="sw ${state.opts[k]?'on':''}"><i></i></span></div>`}

function commander(){
 if(!state.adresse){sheetAdresse();toast('Renseignez une adresse');return}
 const s=SBY[state.cart.storeId], t=totaux(), dur=etaMin(s)+8;
 state.current={id:'MIN-'+(Math.floor(Math.random()*9000)+1000),storeId:s.id,items:Object.assign({},state.cart.items),
  total:t.total,eco:state.ecoPanier,debut:Date.now(),duree:dur*60000,arriveeTxt:heurePlus(dur),
  livreur:['Karim','Sofia','Mehdi','Lucie','Yanis'][Math.floor(Math.random()*5)],adresse:state.adresse,
  date:new Date().toLocaleDateString('fr-FR')};
 state.cart={storeId:null,items:{}};state.pourboire=0;state.ecoPanier=0;save();go('track')}

function etapeIdx(){if(!state.current)return 0;const p=(Date.now()-state.current.debut)/state.current.duree;
 return p<0.18?0:p<0.5?1:p<1?2:3}
function vTrack(){
 const c=state.current;
 if(!c)return`<div class="pad"><div class="empty"><span class="em">📦</span>Aucune commande en cours.
  <button class="btn" style="margin-top:16px" onclick="go('home')">Commander</button></div></div>`;
 const s=SBY[c.storeId], i=etapeIdx(), pct=Math.min(100,Math.round((Date.now()-c.debut)/c.duree*100));
 const rest=Math.max(0,Math.ceil((c.debut+c.duree-Date.now())/60000));
 const n=Object.values(c.items).reduce((a,b)=>a+b,0);
 const et=[['✓','Commande confirmée',esc(s.name)+' a reçu votre commande'],
  ['🧺','Préparation en magasin','Vos '+n+' articles sont rassemblés'],
  ['🛵','Livreur en route',c.livreur+' se dirige vers '+esc(c.adresse)],
  ['🏠','Livré','Bonne dégustation !']];
 return`<div class="pad"><div class="h1">${i>=3?'Commande livrée 🎉':'Livraison en cours'}</div>
 <p class="sub" style="margin:0 0 14px">Commande ${c.id} · ${esc(s.name)}</p>
 <div class="track"><div class="row"><span style="font-size:1.9em">${i>=3?'🏠':'🛵'}</span>
  <span style="flex:1"><b style="font-size:1.2em;display:block">${i>=3?'Livré':'Arrivée vers '+c.arriveeTxt}</b>
  <span class="sub">${i>=3?'Merci et à très vite':'Encore '+rest+' min environ'}</span></span>
  ${i<3?`<button class="iconbtn" onclick="toast('Appel simulé de ${c.livreur}')">📞</button>`:''}</div>
  <div class="progressbar"><i style="width:${Math.max(6,pct)}%"></i></div>
  <div style="margin-top:16px">${et.map((e,k)=>`<div class="step ${k<i?'done':k===i?'now':''}">
   <span class="bul">${k<=i?e[0]:k+1}</span><span><b>${e[1]}</b><span>${e[2]}</span></span></div>`).join('')}</div></div>
 ${c.eco>0?`<div class="ecohero" style="margin-top:14px"><b>💶 ${eur(c.eco)} économisés sur cette commande</b>
  <p style="margin:4px 0 0;font-size:.83em;opacity:.92">Grâce aux équivalents proposés à qualité vérifiée.</p></div>`:''}
 <div class="card" style="padding:14px;margin-top:14px"><div class="row" style="margin-bottom:8px">
  <span style="width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:1.15em">🧑‍🦱</span>
  <span style="flex:1"><b style="display:block;font-size:.94em">${c.livreur}</b><span class="sub">Votre livreur · ⭐ 4,9</span></span>
  <button class="pill green" onclick="toast('Message simulé envoyé')">Message</button></div>
  ${state.opts.montee?'<span class="pill green">📦 Courses montées à votre porte</span> ':''}
  ${state.opts.porte?'<span class="pill">🚪 Dépôt devant la porte</span>':''}</div>
 <div class="card" style="padding:14px;margin-top:14px"><b style="font-size:.94em">Détail</b>
  ${Object.entries(c.items).map(([p,q])=>`<div class="line"><span>${q} × ${esc(PBY[p].famName)} <span class="sub">(${esc(PBY[p].label)})</span></span><span>${eur(prix(c.storeId,p)*q)}</span></div>`).join('')}
  <div class="line total"><span>Total payé</span><span>${eur(c.total)}</span></div></div>
 ${i>=3?`<button class="btn" style="margin-top:16px" onclick="cloturer()">Terminer et noter la livraison</button>`
   :`<button class="btn sec" style="margin-top:16px" onclick="go('home')">Continuer mes courses</button>`}</div>`}
function cloturer(){state.orders.unshift(state.current);state.current=null;save();go('orders');toast('Merci pour votre commande !')}

function vOrders(){
 return`<div class="pad"><div class="h1">Mes commandes</div>
 ${state.eco>0?`<div class="ecohero" style="margin-top:0;margin-bottom:14px"><b>💶 ${eur(state.eco)} économisés au total</b>
   <p style="margin:4px 0 0;font-size:.84em;opacity:.92">Soit environ ${eur(state.eco*12/Math.max(1,state.orders.length+1))} par an à ce rythme.</p></div>`:''}
 ${state.current?`<button class="card ordercard" style="width:100%;border-color:var(--brand)" onclick="go('track')">
   <div class="row"><span style="font-size:1.5em">🛵</span><span style="flex:1"><b>En cours · ${esc(SBY[state.current.storeId].name)}</b>
   <span class="sub">Arrivée vers ${state.current.arriveeTxt}</span></span><span>→</span></div></button>`:''}
 ${state.orders.length?state.orders.map(o=>`<div class="card ordercard"><div class="row">
   <span class="slogo" style="width:42px;height:42px;flex:0 0 42px;font-size:.82em;background:${SBY[o.storeId].color}">${esc(SBY[o.storeId].name.split(' ')[0].slice(0,2).toUpperCase())}</span>
   <span style="flex:1;min-width:0"><b style="display:block">${esc(SBY[o.storeId].name)}</b>
   <span class="sub">${o.date} · ${Object.values(o.items).reduce((a,b)=>a+b,0)} articles · ${eur(o.total)}${o.eco>0?' · '+eur(o.eco)+' économisés':''}</span></span></div>
   <button class="btn sec" style="margin-top:10px;padding:11px" onclick="recommander('${o.id}')">🔁 Recommander au meilleur prix du jour</button></div>`).join('')
  :(state.current?'':'<div class="empty"><span class="em">📦</span>Aucune commande pour l\'instant.</div>')}
 <div class="h2">Réglages</div>
 <div class="card">
  ${optGen('💶 Mode économies',"Proposer systématiquement l'équivalent le moins cher à qualité vérifiée",state.economie,'setEconomie(!state.economie)')}
  ${optGen('🔎 Mode confort','Texte et boutons agrandis',state.comfort,'setComfort(!state.comfort)')}</div>
 <div class="h2">Mon profil</div>
 <div class="card">${PROFILS.map(p=>`<button class="radio ${state.profil===p.id?'on':''}" onclick="choisirProfil('${p.id}')">
  <span class="dotr"></span><span style="font-size:1.15em">${p.em}</span>
  <span class="info"><b>${p.name}</b><span>${p.desc}</span></span></button>`).join('')}</div></div>`}
function optGen(t,d,on,fn){return`<div class="opt" onclick="${fn}"><span class="info"><b>${t}</b><span>${d}</span></span>
 <span class="sw ${on?'on':''}"><i></i></span></div>`}
function recommander(id){const o=state.orders.find(x=>x.id===id);if(!o)return;
 const items={};Object.entries(o.items).forEach(([pid,q])=>{
  const ref=reference(o.storeId,PBY[pid].fam);const v=(state.economie?meilleur(o.storeId,PBY[pid].fam,ref):PBY[pid])||PBY[pid];
  items[v.id]=(items[v.id]||0)+q});
 state.cart={storeId:o.storeId,items};state.storeId=o.storeId;state.ecoPanier=0;save();go('cart');toast('Panier reconstitué au meilleur prix du jour')}

/* ---------- BARRES ---------- */
function nudgeBar(){
 if(!state.nudge)return'';
 const sid=state.cart.storeId||state.storeId, n=state.nudge, a=PBY[n.alt], c=PBY[n.pid];
 const gain=(prix(sid,n.pid)-prix(sid,n.alt))*(state.cart.items[n.pid]||1);
 return`<div class="nudge"><div class="nudge-in">
  <span style="font-size:1.4em">💡</span>
  <span style="flex:1;min-width:0"><b>${esc(a.label)} — ${eur(prix(sid,n.alt))}</b>
  <span>Même ${esc(c.famName.toLowerCase())}, −${n.pct} % au ${c.unit} · vous gagnez ${eur(gain)}</span></span>
  <button class="act" onclick="remplacer('${n.pid}','${n.alt}')">Remplacer</button>
  <button class="iconbtn" style="background:rgba(255,255,255,.2);color:#fff" onclick="state.nudge=null;render()">✕</button>
 </div></div>`}
function bottom(){
 const n=nbArticles(), t=totaux();
 let h=nudgeBar();
 if(n>0&&(state.view==='store'||state.view==='home')){
  h+=`<div class="cartbar"><div class="cartbar-in"><button class="btn" onclick="go('cart')">
   <span>🛒 ${n} article${n>1?'s':''}</span><span style="margin-left:auto">${eur(t.st)} · Voir le panier</span></button></div></div>`;
  return h}
 if(['home','orders','cart'].includes(state.view)){
  const tb=(id,ic,l,b)=>`<button class="tab ${state.view===id?'on':''}" onclick="go('${id}')">
   <span class="ic">${ic}${b?`<span class="badge">${b}</span>`:''}</span><span>${l}</span></button>`;
  h+=`<div class="tabbar"><div class="tabbar-in">${tb('home','🏪','Épiceries')}${tb('cart','🛒','Panier',n)}${tb('orders','📦','Commandes',state.current?'•':0)}</div></div>`}
 return h}

/* ---------- RENDU ---------- */
function render(){try{renderIn()}catch(e){
 $('#app').innerHTML='<div class="pad"><div class="empty"><span class="em">⚠️</span><b>Une erreur est survenue</b>'
  +'<p class="sub">'+esc(e.message)+'</p><button class="btn" style="margin-top:14px" onclick="state.view=\'home\';state.nudge=null;render()">Revenir à l\'accueil</button></div></div>'}}
function renderIn(){
 document.body.classList.toggle('comfort',state.comfort);
 document.querySelectorAll('.cartbar,.tabbar,.nudge').forEach(e=>e.remove());
 let h;
 if(!state.profil)h=vOnboarding();
 else if(state.view==='store')h=topbar()+vStore();
 else if(state.view==='cart')h=topbar()+vCart();
 else if(state.view==='checkout')h=topbar()+vCheckout();
 else if(state.view==='track')h=topbar()+vTrack();
 else if(state.view==='orders')h=topbar()+vOrders();
 else h=vHome();
 $('#app').innerHTML=h;
 document.body.insertAdjacentHTML('beforeend',bottom())}
setInterval(()=>{if(state.current&&state.view==='track')render()},5000);
load();render();
</script>
<script src="live.js"></script>
</body>
</html>
